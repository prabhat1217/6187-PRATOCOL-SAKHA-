name: Build PROTOCOL SAKHA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm packages
        run: npm install

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6
          npm install @capacitor/android@6

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index-1.html www/index.html
          cp native-shim.js www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true
          cp *.ttf www/ 2>/dev/null || true

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Check Android project
        run: |
          ls -la android
          find android -maxdepth 2 -name "gradlew" -o -name "gradlew.bat"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-APK
          path: android/app/build/outputs/apk/debug/*.apk
