name: Build PROTOCOL SAKHA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm packages
        run: npm install

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Prepare web folder
        run: |
          rm -rf www
          mkdir -p www

          cp index-1.html www/index.html

          if [ -f native-shim.js ]; then
            cp native-shim.js www/
          fi

          find . -maxdepth 1 -type f -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webp" -o -name "*.ttf" -o -name "*.woff" -o -name "*.woff2" -exec cp {} www/ \;

          echo "Contents of www:"
          find www -maxdepth 1 -type f -print

      - name: Remove old Android project
        run: rm -rf android

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
         
