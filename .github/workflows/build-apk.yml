name: Build PROTOCOL SAKHA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install npm packages
        run: npm install

      - name: Install Capacitor and required plugins
        run: |
          npm install @capacitor/core@6
          npm install @capacitor/cli@6
          npm install @capacitor/android@6
          npm install @capacitor/filesystem@6
          npm install @capacitor/share@6

      - name: Prepare web folder
        run: |
          rm -rf www
          mkdir -p www

          cp index-1.html www/index.html

          if [ -f native-shim.js ]; then
            cp native-shim.js www/
          fi

          find . -maxdepth 1 -type f \( \
            -name "*.png" -o \
            -name "*.jpg" -o \
            -name "*.jpeg" -o \
            -name "*.webp" -o \
            -name "*.ttf" -o \
            -name "*.woff" -o \
            -name "*.woff2" \
          \) -exec cp {} www/ \;

          echo "===== WWW FILES ====="
          find www -maxdepth 1 -type f -print

      - name: Remove old Android project
        run: rm -rf android

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Verify Capacitor plugins
        run: |
          echo "===== INSTALLED CAPACITOR PACKAGES ====="
          npm list @capacitor/core @capacitor/android @capacitor/filesystem @capacitor/share || true

      - name: Clean Android build
        working-directory: android
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Check APK
        run: |
          echo "===== GENERATED APK ====="
          find android/app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
