name: Build PROTOCOL SAKHA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm packages
        run: npm install

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Prepare web folder
        run: |
          rm -rf www
          mkdir -p www
          cp index-1.html www/index.html

          if [ -f native-shim.js ]; then
            cp native-shim.js www/
          fi

          find . -maxdepth 1 -type f \( \
            -name "*.png" -o \
            -name "*.jpg" -o \
            -name "*.jpeg" -o \
            -name "*.webp" -o \
            -name "*.ttf" -o \
            -name "*.woff" -o \
            -name "*.woff2" \
          \) -exec cp {} www/ \;

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android application
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          s = s.replace(
              'namespace "com.protocolsakha.app"',
              'namespace "com.protocolsakha.app"'
          )

          if 'applicationId "com.protocolsakha.app"' not in s:
              s = s.replace(
                  'defaultConfig {',
                  'defaultConfig {\n        applicationId "com.protocolsakha.app"'
              )

          p.write_text(s)
          PY

          echo "===== app/build.gradle ====="
          cat app/build.gradle

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Clean Android build
        working-directory: android
        run: ./gradlew clean --no-daemon

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Show generated APK
        run: |
          echo "===== APK FILE ====="
          find android/app/build/outputs/apk/debug -type f -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
